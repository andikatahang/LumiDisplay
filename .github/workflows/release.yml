name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish Single-File Executable (win-x64)
      shell: pwsh
      run: |
        $versionArg = @()
        if ("${{ github.ref_name }}" -match '^v(\d+\.\d+\.\d+)') { $versionArg = @("-p:Version=$($Matches[1])") }
        dotnet publish src/LumiDisplay/LumiDisplay.csproj -c Release -r win-x64 --self-contained true `
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None `
          @versionArg -o release-dist/

    - name: Package ZIP Archive and Checksums
      shell: pwsh
      run: |
        Copy-Item README.md, LICENSE release-dist/
        Compress-Archive -Path release-dist\LumiDisplay.exe, release-dist\README.md, release-dist\LICENSE -DestinationPath LumiDisplay-win-x64.zip
        $files = @('release-dist/LumiDisplay.exe', 'LumiDisplay-win-x64.zip')
        $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), (Split-Path $f -Leaf) }
        $lines | Set-Content -Encoding ascii SHA256SUMS.txt
        Get-Content SHA256SUMS.txt

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: LumiDisplay ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        body_path: .github/RELEASE_TEMPLATE.md
        generate_release_notes: true
        files: |
          release-dist/LumiDisplay.exe
          LumiDisplay-win-x64.zip
          SHA256SUMS.txt
