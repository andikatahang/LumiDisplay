name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish Single-File Executable (win-x64)
      run: |
        dotnet publish LumiDisplay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o release-dist/

    - name: Package ZIP Archive
      shell: pwsh
      run: |
        Compress-Archive -Path release-dist\LumiDisplay.exe, release-dist\lumidisplay.ico -DestinationPath LumiDisplay-win-x64.zip

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: LumiDisplay ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          LumiDisplay-win-x64.zip
          release-dist/LumiDisplay.exe
