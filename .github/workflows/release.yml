name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish Single-File Executable (win-x64)
      shell: pwsh
      run: |
        $versionArg = @()
        if ("${{ github.ref_name }}" -match '^v(\d+\.\d+\.\d+)') { $versionArg = @("-p:Version=$($Matches[1])") }
        dotnet publish src/LumiDisplay/LumiDisplay.csproj -c Release -r win-x64 --self-contained true `
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None `
          @versionArg -o release-dist/

    - name: Package ZIP Archive
      shell: pwsh
      run: |
        Copy-Item README.md, LICENSE release-dist/
        Compress-Archive -Path release-dist\LumiDisplay.exe, release-dist\README.md, release-dist\LICENSE -DestinationPath LumiDisplay-win-x64.zip

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: LumiDisplay ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        body_path: .github/RELEASE_TEMPLATE.md
        generate_release_notes: true
        files: |
          release-dist/LumiDisplay.exe
          LumiDisplay-win-x64.zip

    # Releases no longer ship SHA256SUMS.txt; remove it from older releases too (no-op once gone)
    - name: Remove checksum files from releases
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        foreach ($tag in gh release list --limit 100 --json tagName --jq '.[].tagName') {
          gh release delete-asset $tag SHA256SUMS.txt --yes 2>$null
          if ($LASTEXITCODE -eq 0) { "Removed SHA256SUMS.txt from $tag" }
        }
        exit 0
